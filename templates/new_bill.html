{% extends "base.html" %}
{% block title %}New bill{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>New bill</h1>
  <form action="{{ url_for('new_bill') }}" method="post">
    <label for="name">Bill name</label>
    <input id="name" type="text" name="name" placeholder="e.g. Naivasha weekend, Dinner at Java" maxlength="100" required>
    <label for="currency">Currency</label>
    <select id="currency" name="currency">
      {% for code, label in currencies.items() %}
        <option value="{{ code }}">{{ code }} – {{ label }}</option>
      {% endfor %}
    </select>
    <button type="submit" class="btn btn-primary btn-full">Create bill</button>
  </form>
  <p class="auth-link"><a href="{{ url_for('index') }}">← Back to my bills</a></p>
</div>
{% endblock %}
