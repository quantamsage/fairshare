<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FairShare{% endblock %} · FairShare</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <nav class="navbar">
    <a href="{{ url_for('index') }}" class="nav-brand">FairShare</a>
    {% if current_user.is_authenticated %}
      <div class="nav-links">
        <span class="nav-user">{{ current_user.username }}</span>
        <a href="{{ url_for('new_bill') }}" class="btn btn-sm btn-primary">+ New bill</a>
        <form action="{{ url_for('logout') }}" method="post" class="inline">
          <button type="submit" class="btn btn-sm btn-outline">Log out</button>
        </form>
      </div>
    {% endif %}
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="flash" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

</body>
</html>
